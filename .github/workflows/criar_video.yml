name: Gerar Video Streamer GTA 6

on:
  workflow_dispatch: # Permite você clicar num botão para gerar o vídeo quando quiser

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas de voz e vídeo
        run: |
          pip install edge-tts moviepy==1.0.3

      - name: Rodar o script e gerar o vídeo
        run: |
          python gerar_video.py

      - name: Salvar vídeo gerado para download
        uses: actions/upload-artifact@v4
        with:
          name: video-gta6-pronto
          path: video_gta6.mp4
